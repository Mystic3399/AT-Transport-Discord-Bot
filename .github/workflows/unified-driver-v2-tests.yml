name: Unified Driver V2 Safety Tests

on:
  push:
    branches:
      - feature/unified-driver-registration-v2
  pull_request:
    paths:
      - 'unified_*'
      - 'trucky_verified_job_candidate_v2.py'
      - 'world_of_trucks_policy_v2.py'
      - 'company_mods_*'
      - 'tests/**'
      - '.github/workflows/unified-driver-v2-tests.yml'

jobs:
  isolated-policy-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: python -m pip install pytest
      - name: Compile modules
        run: python -m compileall -q world_of_trucks_policy_v2.py unified_real_mileage_audit_v2.py unified_real_mileage_db_audit_v2.py company_mods_eligibility_v2.py company_mods_mileage_audit_v2.py trucky_verified_job_candidate_v2.py trucky_race_evidence_review_v2.py
      - name: Run isolated mileage and WoTr regression tests
        run: |
          python -m pytest -q \
            tests/test_world_of_trucks_policy_v2.py \
            tests/test_unified_real_mileage_audit_v2.py \
            tests/test_unified_real_mileage_db_audit_v2.py \
            tests/test_company_mods_eligibility_v2.py \
            tests/test_trucky_verified_job_candidate_v2.py \
            tests/test_trucky_race_evidence_review_v2.py
