name: Mileage reconciliation regression tests

on:
  push:
    branches:
      - fix/production-mileage-audit-automation
  pull_request:
    branches:
      - fix/dual-provider-mileage-desktop

permissions:
  contents: read

jobs:
  mileage-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile mileage modules
        run: python -m py_compile bot.py automatic_linked_mileage_v2.py trucky_linked_allocation_v2.py unified_job_matching_v2.py historical_route_coverage_audit_v2.py deployment_preflight_v2.py
      - name: Run isolated matching and allocation tests
        env:
          AT_V2_TEST_DATABASE_DISPOSABLE: 'NO'
        run: python -m unittest discover -s tests -p 'test_automatic_mileage_matching_regression.py' -v && python -m unittest discover -s tests -p 'test_trucky_linked_allocation_v2.py' -v && python -m unittest discover -s tests -p 'test_historical_route_coverage_audit_v2.py' -v && python -m unittest discover -s tests -p 'test_historical_replay_identity_v2.py' -v && python -m unittest discover -s tests -p 'test_deployment_preflight_v2.py' -v && python -m unittest discover -s tests -p 'test_replay_schema_contract_v2.py' -v
