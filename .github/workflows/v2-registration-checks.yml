name: V2 registration isolated checks

on:
  push:
    branches:
      - feature/unified-driver-registration-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v2-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: v2_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d v2_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://test:test@127.0.0.1:5432/v2_test
      AT_V2_TEST_DATABASE_DISPOSABLE: 'YES'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install aiohttp asyncpg
      - name: Compile isolated V2 modules
        run: python -m py_compile unified_driver_profiles.py steam_openid_v2.py steam_callback_v2.py trucky_membership_adapter.py unified_distance_units.py distance_normalization_v2.py unified_job_matching_v2.py unified_job_review_v2.py staging_readiness_v2.py unified_staging_ledger_v2.py unified_reconciliation_policy_v2.py unified_legacy_mileage_bridge_v2.py unified_fractional_mileage_v2.py unified_staging_atomic_awards_v2.py unified_canonical_journey_v2.py unified_staging_reconciliation_worker_v2.py trucky_discord_tracker_v2.py trucky_observation_quarantine_v2.py
      - name: Run isolated unit tests
        run: python -m unittest discover -s tests -p 'test_*steam*.py' -v
      - name: Check provider distance normalization
        run: python -m unittest discover -s tests -p 'test_distance_normalization_v2.py' -v
      - name: Check staging safety gate
        run: python -m unittest discover -s tests -p 'test_staging_readiness_v2.py' -v
      - name: Check cross-provider duplicate candidate matching
        run: python -m unittest discover -s tests -p 'test_unified_job_matching_v2.py' -v
      - name: Check safe delivery reconciliation policy
        run: python -m unittest discover -s tests -p 'test_unified_reconciliation_policy_v2.py' -v
      - name: Check legacy mileage compatibility bridge
        run: python -m unittest discover -s tests -p 'test_unified_legacy_mileage_bridge_v2.py' -v
      - name: Check lossless fractional mileage accumulation
        run: python -m unittest discover -s tests -p 'test_unified_fractional_mileage_v2.py' -v
      - name: Check atomic staging mileage awards
        run: python -m unittest discover -s tests -p 'test_unified_staging_atomic_awards_v2.py' -v
      - name: Check canonical journey identity
        run: python -m unittest discover -s tests -p 'test_unified_canonical_journey_v2.py' -v
      - name: Check Trucky Discord parser
        run: python -m unittest discover -s tests -p 'test_trucky_discord_tracker_v2.py' -v
      - name: Check Trucky quarantine safeguards
        run: python -m unittest discover -s tests -p 'test_trucky_observation_quarantine_v2.py' -v
      - name: Check staging reconciliation worker
        run: python -m unittest discover -s tests -p 'test_unified_staging_reconciliation_worker_v2.py' -v
      - name: Check kilometre-to-mile conversion
        run: python -m unittest discover -s tests -p 'test_unified_distance_units.py' -v
      - name: Check shared Trucky and TrucksBook role eligibility
        run: python -m unittest discover -s tests -p 'test_shared_driver_roles_v2.py' -v
      - name: Check schema integrity
        run: python -m unittest discover -s tests -p 'test_unified_schema_integrity.py' -v
      - name: Run disposable database registration integration tests
        run: python -m unittest discover -s tests -p 'test_registration_database_v2.py' -v
      - name: Verify staging award schema against disposable PostgreSQL
        run: python -m unittest discover -s tests -p 'test_staging_award_schema_database_v2.py' -v
      - name: Validate schema against temporary PostgreSQL
        run: |
          python - <<'PY'
          import asyncio, os, asyncpg
          from unified_driver_profiles import SCHEMA
          async def main():
              conn = await asyncpg.connect(os.environ["TEST_DATABASE_URL"])
              try:
                  async with conn.transaction():
                      await conn.execute(SCHEMA)
                      await conn.execute(SCHEMA)
                      names = await conn.fetch("""
                          SELECT tablename FROM pg_tables
                          WHERE schemaname='public' AND tablename LIKE 'unified_%'
                      """)
                      assert len(names) == 9, names
              finally:
                  await conn.close()
          asyncio.run(main())
          PY
