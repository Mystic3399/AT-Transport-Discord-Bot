name: Disposable PostgreSQL mileage integration

on:
  push:
    branches:
      - fix/production-mileage-audit-automation
  pull_request:
    branches:
      - fix/dual-provider-mileage-desktop

permissions:
  contents: read

jobs:
  isolated-mileage-database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: v2_test
          POSTGRES_PASSWORD: disposable_test_only
          POSTGRES_DB: v2_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U v2_test -d v2_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AT_V2_TEST_DATABASE_DISPOSABLE: 'YES'
      TEST_DATABASE_URL: postgresql://v2_test:disposable_test_only@127.0.0.1:5432/v2_test
      AT_V2_ISOLATED_STAGING: 'YES'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Create isolated statistics audit database
        env:
          PGPASSWORD: disposable_test_only
        run: psql -h 127.0.0.1 -U v2_test -d v2_test -c "CREATE DATABASE v2_audit_test"
      - name: Run read-only statistics audit integration test
        env:
          TEST_AUDIT_DATABASE_URL: postgresql://v2_test:disposable_test_only@127.0.0.1:5432/v2_audit_test
        run: python -m unittest discover -s tests -p 'test_driver_statistics_postgres_integration_v2.py' -v
      - name: Run real PostgreSQL allocation tests
        run: python -m unittest discover -s tests -p 'test_trucky_linked_allocation_v2.py' -v
